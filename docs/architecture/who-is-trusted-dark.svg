<!-- t_lan -->
<g id="node5" class="node">
<title>t_lan</title>
<text text-anchor="start" x="28" y="-524.4" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="12.00" fill="#dfdfdf">The LAN · trusted by default</text>
<text text-anchor="start" x="28" y="-509" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#dfdfdf">Webmail and the admin page are plain HTTP on the machine&#39;s LAN address,</text>
<text text-anchor="start" x="28" y="-498" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#dfdfdf">so every computer in the house or office can open them.</text>
</g>
<!-- t_users -->
<g id="node6" class="node">
<title>t_users</title>
<text text-anchor="start" x="58" y="-434.4" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="12.00" fill="#dfdfdf">Everyone with an account · trusted not to attack the office</text>
<text text-anchor="start" x="58" y="-419" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#dfdfdf">Each one&#39;s logins (mail, Nextcloud) are theirs alone.</text>
<text text-anchor="start" x="58" y="-408" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#dfdfdf">The webmail connects to the contact and Nextcloud addresses they type in.</text>
</g>
<!-- t_root -->
<g id="node7" class="node">
<title>t_root</title>
<text text-anchor="start" x="88" y="-308.9" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="12.00" fill="#dfdfdf">You (root) and the stack · fully trusted</text>
<text text-anchor="start" x="88" y="-293.5" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#dfdfdf">You hold every provider password (accounts.yaml)</text>
<text text-anchor="start" x="88" y="-282.5" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#dfdfdf">and can read every mailbox, as the administrator</text>
<text text-anchor="start" x="88" y="-271.5" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#dfdfdf">of any mail server can. Tell your users so.</text>
<text text-anchor="start" x="88" y="-260.5" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#dfdfdf"> </text>
<text text-anchor="start" x="88" y="-249.5" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#dfdfdf">Inside the stack, TLS to the mail server is not</text>
<text text-anchor="start" x="88" y="-238.5" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#dfdfdf">verified: whoever gets in here can read the</text>
<text text-anchor="start" x="88" y="-227.5" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#dfdfdf">secrets anyway.</text>
</g>
<!-- t_guard -->
<g id="node8" class="node">
<title>t_guard</title>
<text text-anchor="start" x="440" y="-304" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#dfdfdf">Roundcube shares a network with the mail</text>
<text text-anchor="start" x="440" y="-293" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#dfdfdf">server only: addresses users type in reach</text>
<text text-anchor="start" x="440" y="-282" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#dfdfdf">the LAN and the Internet, never the</text>
<text text-anchor="start" x="440" y="-271" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#dfdfdf">stack&#39;s own services.</text>
</g>
