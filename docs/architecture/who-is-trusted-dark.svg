<!-- t_host -->
<g id="node12" class="node">
<title>t_host</title>
<text text-anchor="start" x="794" y="-498.4" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="12.00" fill="#dfdfdf">Other users of this machine</text>
<text text-anchor="start" x="794" y="-483" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#dfdfdf">Not trusted: tools/deploy refuses to run</text>
<text text-anchor="start" x="794" y="-472" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#dfdfdf">while etc/ or accounts.yaml is open to them.</text>
</g>
