<text text-anchor="start" x="0" y="-610.1" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="18.00" fill="#dfdfdf">Who is trusted</text>
<text text-anchor="start" x="0" y="-592.5" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#dfdfdf">Trust boundaries · boring&#45;mailstack · a small office: one machine, a handful of people</text>
</g>
