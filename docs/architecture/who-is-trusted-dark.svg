<!-- t_internet -->
<g id="node16" class="node">
<title>t_internet</title>
<text text-anchor="start" x="794" y="-345.4" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="12.00" fill="#dfdfdf">The Internet</text>
<text text-anchor="start" x="794" y="-330" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#dfdfdf">Not trusted by default. From outside, only</text>
<text text-anchor="start" x="794" y="-319" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#dfdfdf">through a TLS reverse proxy, with the stack</text>
<text text-anchor="start" x="794" y="-308" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#dfdfdf">bound to 127.0.0.1.</text>
</g>
<!-- o_internet_a -->
<!-- o_internet_b -->
<!-- o_path -->
<g id="node19" class="node">
<title>o_path</title>
<polygon fill="#1b1b19" stroke="#747570" stroke-width="1.2" points="1022,-208 782,-208 782,-144 1022,-144 1022,-208"/>
</g>
<!-- t_path -->
<g id="node20" class="node">
<title>t_path</title>
<text text-anchor="start" x="794" y="-182.4" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="12.00" fill="#dfdfdf">The way to your providers</text>
<text text-anchor="start" x="794" y="-167" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#dfdfdf">Not trusted. Certificates are verified</text>
<text text-anchor="start" x="794" y="-156" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#dfdfdf">for fetching and for sending.</text>
</g>
<!-- o_path_a -->
<!-- o_path_b -->
<!-- key -->
<g id="node23" class="node">
<title>key</title>
<text text-anchor="start" x="176" y="-61.4" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="12.00" fill="#dfdfdf">Key</text>
<text text-anchor="start" x="176" y="-51" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#dfdfdf">Blue frame · a circle of trust; the deeper, the more it is trusted</text>
<text text-anchor="start" x="176" y="-41" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#dfdfdf">Grey box · not trusted</text>
<text text-anchor="start" x="176" y="-31" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#dfdfdf">Line ending in a bar · kept out, and how</text>
<text text-anchor="start" x="504" y="-61.4" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="12.00" fill="#dfdfdf">Why</text>
<text text-anchor="start" x="504" y="-51" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#dfdfdf">For a family or a small office, a trusted administrator is how things are.</text>
<text text-anchor="start" x="504" y="-41" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#dfdfdf">Designing against them (end&#45;to&#45;end encryption, split secrets) would add</text>
<text text-anchor="start" x="504" y="-31" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#dfdfdf">complexity this setting does not need, and would still not stop root.</text>
</g>
