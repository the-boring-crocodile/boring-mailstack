<!-- key -->
<g id="node28" class="node">
<title>key</title>
<text text-anchor="start" x="207" y="-81.4" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="12.00" fill="#111111">Key</text>
<text text-anchor="start" x="207" y="-71" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="10.00" fill="#587b96">Blue arrow</text>
<text text-anchor="start" x="269" y="-71" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#111111"> · you move the mail</text>
<text text-anchor="start" x="207" y="-61" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="10.00" fill="#578478">Green arrow</text>
<text text-anchor="start" x="278" y="-61" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#111111"> · your filter moves it</text>
<text text-anchor="start" x="207" y="-51" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#111111">Dotted line · it stays where it is</text>
<text text-anchor="start" x="207" y="-41" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="10.00" fill="#111111">Bold frame</text>
<text text-anchor="start" x="271" y="-41" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#111111"> · placed by you: the filter leaves it alone</text>
<text text-anchor="start" x="207" y="-31" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#111111">Grey band · a folder</text>
<text text-anchor="start" x="495" y="-81.4" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="12.00" fill="#111111">The rule</text>
<text text-anchor="start" x="495" y="-71" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#111111">Where you put a mail, it stays: a move or copy in the webmail</text>
<text text-anchor="start" x="495" y="-61" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#111111">or any IMAP client, and a folder you had filed it into at</text>
<text text-anchor="start" x="495" y="-51" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#111111">your provider. Everything else goes where your filter says,</text>
<text text-anchor="start" x="495" y="-41" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#111111">also when you change the filter. Moving a mail into the Inbox</text>
<text text-anchor="start" x="495" y="-31" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#111111">hands it back to the filter.</text>
</g>
